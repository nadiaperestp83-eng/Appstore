name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Necessário para o workflow poder criar Releases no repositório
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Criar e Padronizar Tela PSBookScreen e Imports
        run: |
          python3 - << 'EOF'
          import os
          import glob
          import re

          target_file = "lib/screens/PSBookScreen.dart"
          os.makedirs("lib/screens", exist_ok=True)

          for filepath in glob.glob("lib/**/*.dart", recursive=True):
              with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()

              modified = False

              if re.search(r'PSBoo+K?DetailsScreen', content):
                  content = re.sub(r'PSBoo+K?DetailsScreen', 'PSBookScreen', content)
                  modified = True

              if "PSBookScreen" in content and filepath != target_file:
                  import_statement = "import 'package:playstore_flutter/screens/PSBookScreen.dart';"
                  
                  lines = content.splitlines()
                  new_lines = [l for l in lines if "DetailsScreen.dart" not in l and "PSBookScreen.dart" not in l]
                  content = "\n".join(new_lines)

                  if import_statement not in content:
                      if "import " in content:
                        parts = content.split("import ", 1)
                        content = parts[0] + import_statement + "\nimport " + parts[1]
                      else:
                        content = import_statement + "\n" + content
                      modified = True

              if modified:
                  with open(filepath, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"OK: Ajustado -> {filepath}")
          EOF

      - name: Aplicar correções automáticas de código legado
        run: |
          FILES_FLATBUTTON=(
            "lib/screens/PSNavigationScreen.dart"
            "lib/screens/PSSubscriptionsScreen.dart"
            "lib/screens/PSPurchaseHistoryFragment.dart"
            "lib/screens/PSRewardsFragment.dart"
            "lib/screens/PSInstalledFragment.dart"
            "lib/screens/PSLibraryFragment.dart"
            "lib/screens/PSUpdatesFragments.dart"
            "lib/components/PSTopChartsFragment.dart"
            "lib/components/PSBookReleasesFragment.dart"
            "lib/components/PSBooksTopSellingFragment.dart"
            "lib/screens/PSDetailScreen.dart"
            "lib/screens/PSBookScreen.dart"
            "lib/screens/PSFlagPropertiesScreen.dart"
            "lib/screens/PSRatingReviewScreen.dart"
          )

          for f in "${FILES_FLATBUTTON[@]}"; do
            if [ -f "$f" ]; then
              if ! grep -q "legacy_buttons.dart" "$f"; then
                sed -i "1i import 'package:playstore_flutter/utils/legacy_buttons.dart';" "$f"
                echo "OK: import adicionado em $f"
              else
                echo "OK: $f já tinha o import"
              fi
            fi
          done

          if [ -f "lib/screens/PSDashboardScreen.dart" ]; then
            sed -i "s/title: Text('Games'),/label: 'Games',/" lib/screens/PSDashboardScreen.dart
            sed -i "s/title: Text('Apps'),/label: 'Apps',/" lib/screens/PSDashboardScreen.dart
            sed -i "s/title: Text('Movies'),/label: 'Movies',/" lib/screens/PSDashboardScreen.dart
            sed -i "s/title: Text('Books'),/label: 'Books',/" lib/screens/PSDashboardScreen.dart
          fi

          if [ -f "lib/screens/PSRatingReviewScreen.dart" ]; then
            sed -i "s/Scaffold\.of(context)\.showSnackBar/ScaffoldMessenger.of(context)\.showSnackBar/g" lib/screens/PSRatingReviewScreen.dart
          fi

      - name: Garantir flutter_device_apps no pubspec.yaml e atualizar código
        run: |
          python3 - << 'EOF'
          import re
          import glob

          with open("pubspec.yaml", "r", encoding="utf-8") as f:
              content = f.read()

          content = re.sub(r'\n\s*device_apps\s*:\s*.*', '', content)
          content = re.sub(r'\n\s*flutter_device_apps\s*:\s*.*', '', content)

          if 'flutter_device_apps' not in content:
              content = content.replace('dependencies:', 'dependencies:\n  flutter_device_apps: ^0.8.1')

          with open("pubspec.yaml", "w", encoding="utf-8") as f:
              f.write(content)
          print("OK: pubspec.yaml atualizado com flutter_device_apps: ^0.8.1")

          for filepath in glob.glob("lib/**/*.dart", recursive=True):
              with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                  code = f.read()

              if "package:device_apps/device_apps.dart" in code:
                  code = code.replace("package:device_apps/device_apps.dart", "package:flutter_device_apps/flutter_device_apps.dart")
                  with open(filepath, "w", encoding="utf-8") as f:
                      f.write(code)
                  print(f"OK: Import atualizado em {filepath}")
          EOF

      - name: Configurar Java (necessário para build Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Aumentar memória RAM do Gradle (Evitar Java Heap Space)
        run: |
          mkdir -p android
          echo "org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Limpar cache de build anterior
        run: flutter clean

      - name: Instalar dependências
        run: flutter pub get

      - name: Gerar ícone do app (flutter_launcher_icons)
        run: |
          if [ -f "images/icon/icon.png" ]; then
            dart run flutter_launcher_icons
          else
            echo "AVISO: images/icon/icon.png não existe - pulando geração do ícone (o build continua com o ícone atual)."
          fi

      - name: Gerar código (Isar build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analisar código (lints - informativo, não bloqueia o build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Rodar testes
        run: flutter test

      # Lê o "version:" do pubspec.yaml (ex.: 1.0.0+1) para extrair o version_name (1.0.0)
      - name: Read app version from pubspec.yaml
        id: version
        run: |
          FULL_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo "$FULL_VERSION" | cut -d'+' -f1)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      # Gera a keystore no caminho exigido pelo Gradle no ambiente de CI para evitar falhas de assinatura no release
      - name: Generate Android keystore for build
        run: |
          mkdir -p /home/runner/.config/.android
          keytool -genkey -v -keystore /home/runner/.config/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK (release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      # Define a tag única da Release baseada no pubspec e no número do run do GitHub Actions
      - name: Set release tag
        id: tag
        run: echo "tag=v${{ steps.version.outputs.version_name }}-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Prepare APK for Release
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
             "release/zircon-${{ steps.tag.outputs.tag }}.apk"

      - name: Upload do APK gerado como artefato interno
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: release/*.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Zircon ${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          files: release/*.apk
