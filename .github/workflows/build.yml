name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java (necessário para build Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: false

      - name: Instalar dependências
        run: flutter pub get

      - name: Gerar código (Isar build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analisar código (lints - informativo, não bloqueia o build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Rodar testes
        run: flutter test

      - name: Build APK (release)
        run: flutter build apk --release --dart-define=CI=true

      - name: Upload do APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
