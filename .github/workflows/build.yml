name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Padronizar nome da classe de detalhes para 1 'K' (PSBookDetailsScreen)
        run: |
          # Corrige o arquivo físico se estiver com dois K
          if [ -f "lib/screens/PSBooKDetailsScreen.dart" ]; then
            mv lib/screens/PSBooKDetailsScreen.dart lib/screens/PSBookDetailsScreen.dart
            echo "OK: Arquivo renomeado para PSBookDetailsScreen.dart"
          fi

          # Garante que a classe interna dentro do arquivo seja PSBookDetailsScreen
          if [ -f "lib/screens/PSBookDetailsScreen.dart" ]; then
            sed -i 's/class PSBooKDetailsScreen/class PSBookDetailsScreen/g' lib/screens/PSBookDetailsScreen.dart
            echo "OK: Classe interna corrigida para PSBookDetailsScreen"
          fi

          # Substitui todas as chamadas em todo o projeto de PSBooKDetailsScreen para PSBookDetailsScreen
          find lib/ -type f -name "*.dart" -exec sed -i 's/PSBooKDetailsScreen/PSBookDetailsScreen/g' {} +
          echo "OK: Todas as referências ajustadas para PSBookDetailsScreen"

      - name: Aplicar correções automáticas de código legado
        run: |
          FILES_FLATBUTTON=(
            "lib/screens/PSNavigationScreen.dart"
            "lib/screens/PSSubscriptionsScreen.dart"
            "lib/screens/PSPurchaseHistoryFragment.dart"
            "lib/screens/PSRewardsFragment.dart"
            "lib/screens/PSInstalledFragment.dart"
            "lib/screens/PSLibraryFragment.dart"
            "lib/screens/PSUpdatesFragments.dart"
            "lib/components/PSTopChartsFragment.dart"
            "lib/components/PSBookReleasesFragment.dart"
            "lib/components/PSBooksTopSellingFragment.dart"
            "lib/screens/PSDetailScreen.dart"
            "lib/screens/PSBookScreen.dart"
            "lib/screens/PSFlagPropertiesScreen.dart"
            "lib/screens/PSRatingReviewScreen.dart"
          )

          for f in "${FILES_FLATBUTTON[@]}"; do
            if [ -f "$f" ]; then
              if ! grep -q "legacy_buttons.dart" "$f"; then
                sed -i "1i import 'package:playstore_flutter/utils/legacy_buttons.dart';" "$f"
                echo "OK: import adicionado em $f"
              else
                echo "OK: $f já tinha o import"
              fi
            else
              echo "AVISO: arquivo não encontrado: $f (verifique o caminho)"
            fi
          done

          if [ -f "lib/screens/PSDashboardScreen.dart" ]; then
            sed -i "s/title: Text('Games'),/label: 'Games',/" lib/screens/PSDashboardScreen.dart
            sed -i "s/title: Text('Apps'),/label: 'Apps',/" lib/screens/PSDashboardScreen.dart
            sed -i "s/title: Text('Movies'),/label: 'Movies',/" lib/screens/PSDashboardScreen.dart
            sed -i "s/title: Text('Books'),/label: 'Books',/" lib/screens/PSDashboardScreen.dart
            echo "OK: PSDashboardScreen.dart corrigido"
          else
            echo "AVISO: PSDashboardScreen.dart não encontrado"
          fi

          if [ -f "lib/screens/PSRatingReviewScreen.dart" ]; then
            sed -i "s/Scaffold\.of(context)\.showSnackBar/ScaffoldMessenger.of(context)\.showSnackBar/g" lib/screens/PSRatingReviewScreen.dart
            echo "OK: PSRatingReviewScreen.dart (showSnackBar) corrigido"
          fi

      - name: Configurar Java (necessário para build Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Limpar cache de build anterior
        run: flutter clean

      - name: Instalar dependências
        run: flutter pub get

      - name: Gerar código (Isar build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analisar código (lints - informativo, não bloqueia o build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Rodar testes
        run: flutter test

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload do APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
