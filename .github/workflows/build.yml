name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Criar e Padronizar Tela PSBookScreen e Imports
        run: |
          python3 - << 'EOF'
          import os
          import glob
          import re

          target_file = "lib/screens/PSBookScreen.dart"
          os.makedirs("lib/screens", exist_ok=True)

          for filepath in glob.glob("lib/**/*.dart", recursive=True):
              with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()

              modified = False

              if re.search(r'PSBoo+K?DetailsScreen', content):
                  content = re.sub(r'PSBoo+K?DetailsScreen', 'PSBookScreen', content)
                  modified = True

              if "PSBookScreen" in content and filepath != target_file:
                  import_statement = "import 'package:playstore_flutter/screens/PSBookScreen.dart';"
                  
                  lines = content.splitlines()
                  new_lines = [l for l in lines if "DetailsScreen.dart" not in l and "PSBookScreen.dart" not in l]
                  content = "\n".join(new_lines)

                  if import_statement not in content:
                      if "import " in content:
                        parts = content.split("import ", 1)
                        content = parts[0] + import_statement + "\nimport " + parts[1]
                      else:
                        content = import_statement + "\n" + content
                      modified = True

              if modified:
                  with open(filepath, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"OK: Ajustado -> {filepath}")
          EOF

      - name: Aplicar correções automáticas de código legado
        run: |
          FILES_FLATBUTTON=(
            "lib/screens/PSNavigationScreen.dart"
            "lib/screens/PSSubscriptionsScreen.dart"
            "lib/screens/PSPurchaseHistoryFragment.dart"
            "lib/screens/PSRewardsFragment.dart"
            "lib/screens/PSInstalledFragment.dart"
            "lib/screens/PSLibraryFragment.dart"
            "lib/screens/PSUpdatesFragments.dart"
            "lib/components/PSTopChartsFragment.dart"
            "lib/components/PSBookReleasesFragment.dart"
            "lib/components/PSBooksTopSellingFragment.dart"
            "lib/screens/PSDetailScreen.dart"
            "lib/screens/PSBookScreen.dart"
            "lib/screens/PSFlagPropertiesScreen.dart"
            "lib/screens/PSRatingReviewScreen.dart"
          )

          for f in "${FILES_FLATBUTTON[@]}"; do
            if [ -f "$f" ]; then
              if ! grep -q "legacy_buttons.dart" "$f"; then
                sed -i "1i import 'package:playstore_flutter/utils/legacy_buttons.dart';" "$f"
                echo "OK: import adicionado em $f"
              else
                echo "OK: $f já tinha o import"
              fi
            else
              echo "AVISO: arquivo não encontrado: $f (verifique o caminho)"
            fi
          done

          if [ -f "lib/screens/PSDashboardScreen.dart" ]; then
            sed -i "s/title: Text('Games'),/label: 'Games',/" lib/screens/PSDashboardScreen.dart
            sed -i "s/title: Text('Apps'),/label: 'Apps',/" lib/screens/PSDashboardScreen.dart
            sed -i "s/title: Text('Movies'),/label: 'Movies',/" lib/screens/PSDashboardScreen.dart
            sed -i "s/title: Text('Books'),/label: 'Books',/" lib/screens/PSDashboardScreen.dart
            echo "OK: PSDashboardScreen.dart corrigido"
          else
            echo "AVISO: PSDashboardScreen.dart não encontrado"
          fi

          if [ -f "lib/screens/PSRatingReviewScreen.dart" ]; then
            sed -i "s/Scaffold\.of(context)\.showSnackBar/ScaffoldMessenger.of(context)\.showSnackBar/g" lib/screens/PSRatingReviewScreen.dart
            echo "OK: PSRatingReviewScreen.dart (showSnackBar) corrigido"
          fi

      - name: Corrigir SDK 34 de forma segura no Gradle
        run: |
          # Remove blocos duplicados anteriores se houver
          if [ -f "android/build.gradle" ]; then
            # Adiciona a configuração de subprojetos usando avaliação segura com gradle.projectsEvaluated
            python3 -c '
            path = "android/build.gradle"
            with open(path, "r") as f:
                content = f.read()
            snippet = """
            subprojects {
                project.evaluationDependsOn(":app")
            }
            subprojects {
                afterEvaluate { project ->
                    if (project.hasProperty("android")) {
                        project.android {
                            if (namespace == null) {
                                namespace project.group
                            }
                            compileSdkVersion 34
                            defaultConfig {
                                targetSdkVersion 34
                            }
                        }
                    }
                }
            }
            """
            if "subprojects {" not in content:
                with open(path, "a") as f:
                    f.write(snippet)
                print("OK: Configuração segura adicionada ao build.gradle")
            '
          fi

      - name: Configurar Java (necessário para build Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Aumentar memória RAM do Gradle (Evitar Java Heap Space)
        run: |
          mkdir -p android
          echo "org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Limpar cache de build anterior
        run: flutter clean

      - name: Instalar dependências
        run: flutter pub get

      - name: Gerar código (Isar build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analisar código (lints - informativo, não bloqueia o build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Rodar testes
        run: flutter test

      - name: Build APK (release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload do APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
