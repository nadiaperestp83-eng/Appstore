name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Padronizar e Injetar Imports via Python (Blindado)
        run: |
          python3 - << 'EOF'
          import os
          import glob

          # 1. Renomeia o arquivo físico se estiver com dois K
          if os.path.exists("lib/screens/PSBooKDetailsScreen.dart"):
              os.rename("lib/screens/PSBooKDetailsScreen.dart", "lib/screens/PSBookDetailsScreen.dart")
              print("OK: Arquivo renomeado para PSBookDetailsScreen.dart")

          # 2. Varre todos os arquivos .dart do projeto
          for filepath in glob.glob("lib/**/*.dart", recursive=True):
              with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()

              modified = False

              # Corrige nome da classe interna se necessário
              if "class PSBooKDetailsScreen" in content:
                  content = content.replace("class PSBooKDetailsScreen", "class PSBookDetailsScreen")
                  modified = True

              # Substitui chamadas antigas com dois K
              if "PSBooKDetailsScreen" in content:
                  content = content.replace("PSBooKDetailsScreen", "PSBookDetailsScreen")
                  modified = True

              # Se o arquivo usa a classe (mas não é o próprio arquivo da tela)
              if "PSBookDetailsScreen" in content and filepath != "lib/screens/PSBookDetailsScreen.dart":
                  import_statement = "import 'package:playstore_flutter/screens/PSBookDetailsScreen.dart';"
                  
                  # Remove imports antigos errados se houver
                  lines = content.splitlines()
                  new_lines = []
                  has_import = False
                  
                  for line in lines:
                      if "PSBooKDetailsScreen.dart" in line or "PSBookDetailsScreen.dart" in line:
                          continue  # Remove para reinserir o correto no topo
                      new_lines.append(line)
                      if import_statement in line:
                          has_import = True

                  content = "\n".join(new_lines)

                  # Insere o import correto logo após o primeiro import existente ou no topo
                  if not has_import:
                      if "import " in content:
                          parts = content.split("import ", 1)
                          content = parts[0] + import_statement + "\nimport " + parts[1]
                      else:
                          content = import_statement + "\n" + content
                      modified = True

              if modified:
                  with open(filepath, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"OK: Processado e corrigido -> {filepath}")
          EOF

      - name: Aplicar correções automáticas de código legado
        run: |
          FILES_FLATBUTTON=(
            "lib/screens/PSNavigationScreen.dart"
            "lib/screens/PSSubscriptionsScreen.dart"
            "lib/screens/PSPurchaseHistoryFragment.dart"
            "lib/screens/PSRewardsFragment.dart"
            "lib/screens/PSInstalledFragment.dart"
            "lib/screens/PSLibraryFragment.dart"
            "lib/screens/PSUpdatesFragments.dart"
            "lib/components/PSTopChartsFragment.dart"
            "lib/components/PSBookReleasesFragment.dart"
            "lib/components/PSBooksTopSellingFragment.dart"
            "lib/screens/PSDetailScreen.dart"
            "lib/screens/PSBookScreen.dart"
            "lib/screens/PSFlagPropertiesScreen.dart"
            "lib/screens/PSRatingReviewScreen.dart"
          )

          for f in "${FILES_FLATBUTTON[@]}"; do
            if [ -f "$f" ]; then
              if ! grep -q "legacy_buttons.dart" "$f"; then
                sed -i "1i import 'package:playstore_flutter/utils/legacy_buttons.dart';" "$f"
                echo "OK: import adicionado em $f"
              else
                echo "OK: $f já tinha o import"
              fi
            else
              echo "AVISO: arquivo não encontrado: $f (verifique o caminho)"
            fi
          done

          if [ -f "lib/screens/PSDashboardScreen.dart" ]; then
            sed -i "s/title: Text('Games'),/label: 'Games',/" lib/screens/PSDashboardScreen.dart
            sed -i "s/title: Text('Apps'),/label: 'Apps',/" lib/screens/PSDashboardScreen.dart
            sed -i "s/title: Text('Movies'),/label: 'Movies',/" lib/screens/PSDashboardScreen.dart
            sed -i "s/title: Text('Books'),/label: 'Books',/" lib/screens/PSDashboardScreen.dart
            echo "OK: PSDashboardScreen.dart corrigido"
          else
            echo "AVISO: PSDashboardScreen.dart não encontrado"
          fi

          if [ -f "lib/screens/PSRatingReviewScreen.dart" ]; then
            sed -i "s/Scaffold\.of(context)\.showSnackBar/ScaffoldMessenger.of(context)\.showSnackBar/g" lib/screens/PSRatingReviewScreen.dart
            echo "OK: PSRatingReviewScreen.dart (showSnackBar) corrigido"
          fi

      - name: Configurar Java (necessário para build Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'
          cache: true

      - name: Limpar cache de build anterior
        run: flutter clean

      - name: Instalar dependências
        run: flutter pub get

      - name: Gerar código (Isar build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analisar código (lints - informativo, não bloqueia o build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Rodar testes
        run: flutter test

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload do APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
