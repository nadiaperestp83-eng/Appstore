name: playstore_flutter
description: "Loja de aplicativos descentralizada (GitHub Releases + F-Droid)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # =========================================================
  # Dependências ORIGINAIS do fork (reconstruídas a partir do
  # seu próprio log de CI — eram as que sumiram quando meu
  # pubspec te substituiu o arquivo original por engano).
  # =========================================================
  nb_utils: ^7.3.5
  google_fonts: ^6.2.1
  cached_network_image: ^3.0.0
  image_picker: ^0.8.1+4
  sqflite: ^2.0.0+3
  shared_preferences: ^2.0.6
  fluttertoast: ^9.1.0
  share: ^2.0.4
  webview_flutter: ^2.0.10
  flutter_vector_icons: ^1.0.0
  flutter_staggered_animations: ^1.0.0
  flare_flutter: ^3.0.1
  connectivity: ^3.0.6
  uuid: ^3.0.4
  flutter_mobx: ^2.0.0
  mobx: ^2.0.1

  # =========================================================
  # Minhas adições (loja descentralizada GitHub + F-Droid)
  # =========================================================
  http: ^1.2.2

  # Cache local (fork ativo do Isar; o pacote "isar" original está abandonado)
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.4

  # Instalador de APK
  open_file: ^3.5.7
  permission_handler: ^11.3.1
  device_apps: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Geração de código do MobX (original do fork)
  mobx_codegen: ^2.0.1+3

  # Geração de código do Isar (minha adição)
  build_runner: ^2.4.13
  isar_community_generator: ^3.3.2

flutter:
  uses-material-design: true

  # Descomente e ajuste se o seu projeto já usa uma pasta de assets:
  # assets:
  #   - assets/images/
