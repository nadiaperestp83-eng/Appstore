name: playstore_flutter
description: "Loja de aplicativos descentralizada (GitHub Releases + F-Droid)."
publish_to: 'none'
version: 2.7.26+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # =========================================================
  # Dependências ORIGINAIS do fork (atualizadas para compatibilidade)
  # =========================================================
  nb_utils: ^7.3.5
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  sqflite: ^2.3.2
  shared_preferences: ^2.2.3
  fluttertoast: ^9.1.0
  share_plus: ^12.0.2
  flutter_vector_icons: ^2.0.0
  flutter_staggered_animations: ^1.1.1
  flare_flutter: ^3.0.1
  connectivity_plus: ^7.3.1
  uuid: ^4.3.3
  flutter_mobx: ^2.2.0
  mobx: ^2.3.0
  dio: ^5.7.0

  # =========================================================
  # Minhas adições (loja descentralizada GitHub + F-Droid)
  # =========================================================
  http: ^1.2.2

  # Cache local (fork ativo do Isar)
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.4

  # Instalador de APK
  open_file: ^3.5.7
  permission_handler: ^11.3.1
  device_apps: ^2.2.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  args: ^2.4.2

  # Gera os ícones do Android automaticamente a partir de UMA imagem
  # (image_path abaixo) - veja a config em "flutter_launcher_icons:" mais
  # embaixo neste arquivo, e o passo a passo no comentário logo ali.
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  platform: ^3.1.5
  flutter_plugin_android_lifecycle: ^2.0.17
  
  # Geração de código do MobX
  mobx_codegen: ^2.3.0

  # Geração de código do Isar
  build_runner: ^2.4.13
  isar_community_generator: ^3.3.2

flutter:
  uses-material-design: true
  assets:
    - images/playStore/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "images/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "images/icon/icon.png"
