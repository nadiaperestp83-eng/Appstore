name: playstore
description: "Loja de aplicativos descentralizada (GitHub Releases + F-Droid)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Rede / parsing ---
  http: ^1.2.2

  # --- Cache local (Isar - fork ativo, o pacote "isar" original está abandonado) ---
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.4

  # --- Instalador de APK ---
  open_file: ^3.5.7
  permission_handler: ^11.3.1
  device_apps: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # --- Geração de código do Isar ---
  build_runner: ^2.4.13
  isar_community_generator: ^3.3.2

flutter:
  uses-material-design: true

  # Descomente e ajuste se o seu projeto já usa uma pasta de assets:
  # assets:
  #   - assets/images/
